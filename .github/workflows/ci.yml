name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  offline-client:
    name: Offline sync client (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/offline/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end against the Go engine
        run: npm run test:e2e
      - run: npm run build

  flutter-client:
    name: Flutter client (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/offline/package-lock.json
      - name: Install the TypeScript client (for the cross-client test)
        run: npm ci
        working-directory: clients/offline
      - run: flutter pub get
      - run: flutter analyze
      - name: Test (unit, end-to-end against the Go server, cross-client with TypeScript)
        run: flutter test
        env:
          GOLARAVEL_E2E: "1"
      - name: Web (Chrome) - WASM SQLite storage, WebCrypto key vault, logic
        timeout-minutes: 10
        run: |
          ./tool/web_test_assets.sh
          # Ubuntu 24.04 runners block the user namespaces Chrome's sandbox
          # needs: Chrome starts but its renderers never do, and flutter test
          # waits forever. The sandbox adds nothing in a throwaway runner.
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          CHROME_EXECUTABLE="$RUNNER_TEMP/chrome" flutter test --platform chrome -r expanded \
            test/web_storage_test.dart test/web_key_vault_test.dart test/web_logic_test.dart \
            test/features_test.dart test/native_key_vault_test.dart

  integration:
    name: Integration (MySQL, Postgres, Redis)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: golaravel
          MYSQL_DATABASE: golaravel
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgolaravel"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golaravel
          POSTGRES_DB: golaravel
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      GOLARAVEL_INTEGRATION_REQUIRED: "1"
      GOLARAVEL_TEST_MYSQL_DSN: root:golaravel@tcp(127.0.0.1:3306)/golaravel
      GOLARAVEL_TEST_POSTGRES_DSN: postgres://postgres:golaravel@127.0.0.1:5432/golaravel?sslmode=disable
      GOLARAVEL_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum
      - name: Integration tests
        working-directory: integration
        run: go test -count=1 -v ./...
